name: Atualizar painel de atividade

on:
  schedule:
    - cron: "17 6 * * *"   # diariamente, 03:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados e redesenhar o SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py --fetch
      - name: Publicar se houve mudança
        run: |
          if [ -n "$(git status --porcelain data assets/graphics/activity.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data assets/graphics/activity.svg
            git commit -m "chore: atualiza painel de atividade"
            git push
          fi
