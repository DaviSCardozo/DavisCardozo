<text x="30" y="594" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#06B6D4" letter-spacing="1.2">OP. 60 · JÚNIOR → PLENO → SÊNIOR</text>
<text x="30" y="622" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">Projetista mecânico</text>
<text x="30" y="647" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8B95A5">Decidir a solução inteira e responder por ela.</text>
<rect x="16" y="670" width="568" height="90" rx="10" fill="#84CC16" fill-opacity="0.05" stroke="#84CC16" stroke-opacity="0.5" stroke-dasharray="4 4"/>
<text x="30" y="694" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#84CC16" letter-spacing="1.2">OP. 70 · EM TRANSIÇÃO · AGORA</text>
<text x="30" y="722" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#84CC16">Desenvolvedor Full Stack</text>
<text x="30" y="747" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" fill="#F4F4F5">A mesma mentalidade, em um novo material.</text>
