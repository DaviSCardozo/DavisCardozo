<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 778" width="600" height="778" role="img" aria-label="Folha de processo — trajetória profissional: operação 10: Jornaleiro (3+ anos) — Atender gente todo dia, cedo, sem falhar: constância.; operação 20: Auxiliar de produção — O chão de fábrica: ritmo, processo e trabalho em equipe.; operação 30: Operador de máquina — Responder pelo resultado: padrão, qualidade e segurança.; operação 40: Montador mecânico — Sentir na mão o erro de projeto: quem monta paga a conta.; operação 50: Desenhista detalhista — Precisão e norma: o desenho é um contrato com quem fabrica.; operação 60: Projetista mecânico (júnior → pleno → sênior) — Decidir a solução inteira e responder por ela.; operação 70: Desenvolvedor Full Stack (em transição · agora) — A mesma mentalidade, em um novo material.">
<title>Folha de processo — trajetória profissional: operação 10: Jornaleiro (3+ anos) — Atender gente todo dia, cedo, sem falhar: constância.; operação 20: Auxiliar de produção — O chão de fábrica: ritmo, processo e trabalho em equipe.; operação 30: Operador de máquina — Responder pelo resultado: padrão, qualidade e segurança.; operação 40: Montador mecânico — Sentir na mão o erro de projeto: quem monta paga a conta.; operação 50: Desenhista detalhista — Precisão e norma: o desenho é um contrato com quem fabrica.; operação 60: Projetista mecânico (júnior → pleno → sênior) — Decidir a solução inteira e responder por ela.; operação 70: Desenvolvedor Full Stack (em transição · agora) — A mesma mentalidade, em um novo material.</title>
<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}.blink{animation:blink 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
