<text x="30" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#06B6D4" letter-spacing="2.5">FOLHA DE PROCESSO · TRAJETÓRIA</text>
<path d="M30 64H570" stroke="#3B4252"/>
<text x="30" y="94" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#06B6D4" letter-spacing="1.2">OP. 10 · 3+ ANOS</text>
<text x="30" y="122" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">Jornaleiro</text>
<text x="30" y="147" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8B95A5">Atender gente todo dia, cedo, sem falhar: constância.</text>
<path d="M30 164H570" stroke="#1F2733"/>
<text x="30" y="194" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#06B6D4" letter-spacing="1.2">OP. 20</text>
<text x="30" y="222" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">Auxiliar de produção</text>
<text x="30" y="247" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B95A5">O chão de fábrica: ritmo, processo e trabalho em equipe.</text>
<path d="M30 264H570" stroke="#1F2733"/>
<text x="30" y="294" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#06B6D4" letter-spacing="1.2">OP. 30</text>
<text x="30" y="322" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">Operador de máquina</text>
<text x="30" y="347" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B95A5">Responder pelo resultado: padrão, qualidade e segurança.</text>
<path d="M30 364H570" stroke="#1F2733"/>
<text x="30" y="394" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#06B6D4" letter-spacing="1.2">OP. 40</text>
<text x="30" y="422" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">Montador mecânico</text>
<text x="30" y="447" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B95A5">Sentir na mão o erro de projeto: quem monta paga a conta.</text>
<path d="M30 464H570" stroke="#1F2733"/>
<text x="30" y="494" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#06B6D4" letter-spacing="1.2">OP. 50</text>
<text x="30" y="522" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F4F5">Desenhista detalhista</text>
<text x="30" y="547" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B95A5">Precisão e norma: o desenho é um contrato com quem fabrica.</text>
