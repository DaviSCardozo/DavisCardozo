<svg viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Davi Cardozo — Engenharia para Engenharia de Software">
  <defs>
    <linearGradient id="accentGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <linearGradient id="accentGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#06B6D4" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <clipPath id="titleClip">
      <rect x="0" y="120" width="0" height="100">
        <animate attributeName="width" from="0" to="760" dur="1.3s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1600" height="420" fill="#090D16"/>
  <rect width="1600" height="420" fill="url(#grid)" opacity="0.14"/>
  <rect width="1600" height="420" fill="#090D16" opacity="0.35"/>

  <!-- LEFT: engineering draft -->
  <g transform="translate(90,70)" fill="none" stroke="#06B6D4" stroke-width="1.4" opacity="0.85">
    <circle cx="190" cy="140" r="96" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 190 140" to="360 190 140" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="140" r="60" stroke="#84CC16" opacity="0.55" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="360 190 140" to="0 190 140" dur="26s" repeatCount="indefinite"/>
    </circle>
    <path d="M 190 20 V 260 M 60 140 H 320" stroke-width="0.8" opacity="0.5"/>
    <path d="M 20 250 L 150 250 L 150 90 L 350 90" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" from="500" to="0" dur="2.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </path>
    <path d="M 20 250 L 20 240 M 150 250 L 150 240" stroke-width="1"/>
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#5b6b7d" stroke="none">
      <text x="24" y="270">Ø130mm</text>
      <text x="300" y="80">+0.02</text>
    </g>
    <circle cx="190" cy="140" r="4" fill="#84CC16" stroke="none">
      <animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="90" r="3" fill="#06B6D4" stroke="none">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CENTER pivot -->
  <g transform="translate(760,0)">
    <rect x="-1" y="40" width="2" height="340" fill="url(#accentGradV)"/>
    <circle cx="0" cy="210" r="40" fill="url(#glowNode)">
      <animate attributeName="r" values="34;46;34" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="210" r="5" fill="#F4F4F5"/>
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="20" fill="#84CC16" transform="translate(0,218)">
      <text x="-9" y="0">{ }</text>
    </g>
  </g>

  <!-- RIGHT: identity -->
  <g transform="translate(830,0)">
    <g clip-path="url(#titleClip)">
      <text x="0" y="195" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="66" letter-spacing="1" fill="#F4F4F5">DAVI CARDOZO</text>
    </g>

    <path d="M 2 222 H 700" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.1s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </path>

    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="19" letter-spacing="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
      <text x="0" y="258" fill="#7b8a9c">ENGENHARIA</text>
      <path d="M 196 252 H 236" stroke="url(#accentGrad)" stroke-width="2"/>
      <path d="M 228 246 L 236 252 L 228 258" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
      <text x="252" y="258" fill="#84CC16">ENGENHARIA DE SOFTWARE</text>
      <rect x="610" y="240" width="3" height="22" fill="#06B6D4">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12.5" letter-spacing="1.2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.9s" fill="freeze"/>
      <g fill="#aeb9c7">
        <rect x="0" y="288" width="118" height="28" rx="14" fill="none" stroke="#1f2a38"/>
        <text x="16" y="306">FULL STACK</text>
        <rect x="130" y="288" width="128" height="28" rx="14" fill="none" stroke="#1f2a38"/>
        <text x="146" y="306">IA APLICADA</text>
        <rect x="270" y="288" width="196" height="28" rx="14" fill="none" stroke="#1f2a38"/>
        <text x="286" y="306">ENGENHARIA DE DADOS</text>
      </g>
    </g>
  </g>
</svg>
