    <rect x="1" y="1" width="8" height="218" rx="4" fill="url(#bar-ai-portfolio)"/>

    <g transform="translate(40,30)" color="#84CC16">
      
      <circle cx="36" cy="20" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
